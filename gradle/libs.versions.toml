[versions]
jdk = "21"
android-compileSdk = "37"
android-compileSdkMinor = "2"
android-minSdk = "37"
android-targetSdk = "37"
agp = "9.5.3"
kotlin = "2.4.21"
compose-bom = "2026.11.01"
activity-compose = "1.13.0"
core-ktx = "1.19.1"
lifecycle = "2.11.1"
junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-uiautomator = "2.4.1"
ktlint-plugin = "14.2.0"
ktlint-cli = "1.8.0"
detekt = "1.23.8"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.13.0"
sshlib = "0.6.9"
# Native terminal build (ADR-001): NDK and CMake installed by the Android Gradle Plugin,
# Zig and the libghostty-vt release tarballs downloaded by :terminal and checked with SHA-256.
android-ndk = "29.0.14206865"
android-cmake = "3.22.1"
# Highest API level of the NDK sysroot, used as Zig target for libghostty-vt.
libghostty-vt-android-api = "35"
libghostty-vt = "1.0.2"
libghostty-vt-sha256 = "1dcafa8a3357f3a6bbf4f2696e61de611400c5469518716793dfffd35f008b3e"
libghostty-vt-deps-sha256 = "c56156dbea82fdf71f13bf0d704cdf4393b6a04208d7f9691e0d7f60c7f9ca4d"
zig = "0.17.1"
zig-sha256-linux-intel = "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a"
zig-sha256-linux-arm = "a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795"
zig-sha256-macos-intel = "9af07b20319fbd0c92ee46ad23e81d6a782b1aaea2cfb8dcbff35f1d2c7ddbb7"
zig-sha256-macos-arm = "75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
sshlib = { module = "org.connectbot.sshlib:sshlib", version.ref = "sshlib" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
