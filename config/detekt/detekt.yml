# Overrides of the detekt default configuration (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    # Composable functions are named in PascalCase.
    ignoreAnnotated:
      - Composable

style:
  MagicNumber:
    # Enum entries carry wire-protocol codes.
    ignoreEnums: true
  UnusedPrivateMember:
    # Compose previews are used by the IDE only.
    ignoreAnnotated:
      - Preview
